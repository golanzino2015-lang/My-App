plugins {
    id 'com.android.application'
}

android {
    namespace 'com.questionbubble.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.questionbubble.app'
        minSdk 30          // Android 11+ (needed for accessibility screenshots)
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/versions/**/module-info.class',
                    'META-INF/DEPENDENCIES',
                    'META-INF/INDEX.LIST',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/*.md',
            ]
        }
    }
}

dependencies {
    // Official Anthropic SDK, used for Claude
    implementation 'com.anthropic:anthropic-java:3.2.0'
}
