plugins {
    id 'com.android.application'
}

android {
    namespace 'com.questionbubble.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.questionbubble.app'
        minSdk 30          // Android 11+ (needed for accessibility screenshots)
        targetSdk 35
        // Each GitHub build gets a higher version code (the Play Store requires it to go up)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '1.0'
    }

    // Release signing comes from GitHub secrets (see README). Without them the .aab is unsigned.
    def releaseKeystore = System.getenv('RELEASE_KEYSTORE_PATH')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/versions/**/module-info.class',
                    'META-INF/DEPENDENCIES',
                    'META-INF/INDEX.LIST',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/*.md',
            ]
        }
    }
}

dependencies {
    // Official Anthropic SDK, used for Claude
    implementation 'com.anthropic:anthropic-java:3.2.0'
}
