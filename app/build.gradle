plugins {
    id 'com.android.application'
}

android {
    namespace 'com.questionbubble.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.questionbubble.app'
        minSdk 30          // Android 11+ (needed for accessibility screenshots)
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
