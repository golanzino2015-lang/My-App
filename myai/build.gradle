plugins {
    id 'com.android.application'
}

// My AI: a separate app. Same look as My App, but only the AI you train yourself.
android {
    namespace 'com.questionbubble.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.questionbubble.myai'
        minSdk 30
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '1.0'
        // The training engine is C, built for phones (arm64) and emulators (x86_64).
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
