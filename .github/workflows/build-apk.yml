name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish My AI's APK as a release download

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle   # keep downloaded build tools between runs

      # My AI first, so its download is published even if My App's build has a problem.
      # Download servers sometimes answer "too many requests", so retry with a pause.
      - name: Build My AI
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew :myai:assembleDebug --no-daemon && exit 0
            echo "Build failed (attempt $i), retrying in $((i * 30))s"; sleep $((i * 30))
          done
          exit 1

      # One fixed link that downloads the newest My AI APK directly (no zip):
      # https://github.com/<owner>/<repo>/releases/download/my-ai/MyAI.apk
      - name: Publish My AI download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp myai/build/outputs/apk/debug/myai-debug.apk MyAI.apk
          gh release view my-ai >/dev/null 2>&1 || gh release create my-ai --title "My AI" \
            --notes "Newest build of My AI. Download MyAI.apk below and install it." --target "$GITHUB_SHA"
          gh release upload my-ai MyAI.apk myai/server/brain_server.py --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: MyAI-apk
          path: myai/build/outputs/apk/debug/myai-debug.apk

      - name: Build My App
        run: |
          for i in 1 2 3; do
            ./gradlew :app:assembleDebug --no-daemon && exit 0
            echo "Build failed (attempt $i), retrying in $((i * 30))s"; sleep $((i * 30))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: QuestionBubble-apk
          path: app/build/outputs/apk/debug/app-debug.apk
