name: Create signing key

# Run this once (Actions → Create signing key → Run workflow) to make your Play Store upload key
# without a computer. It refuses to run while the repository is public, because anyone who can
# see a public repo can download its build files.

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if the repository is public
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::This repository is public. Make it private first (Settings → General → Danger Zone → Change visibility), then run this again."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate upload key
        run: |
          mkdir key && cd key
          PW=$(openssl rand -hex 12)
          keytool -genkeypair -keystore upload.jks -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Question Bubble"
          base64 -w0 upload.jks > RELEASE_KEYSTORE_BASE64.txt
          printf '%s' "$PW" > RELEASE_KEYSTORE_PASSWORD.txt
          printf '%s' "$PW" > RELEASE_KEY_PASSWORD.txt
          printf 'upload' > RELEASE_KEY_ALIAS.txt
          cat > READ_ME.txt <<'TXT'
          Add each .txt file below as a repository secret (Settings -> Secrets and variables ->
          Actions -> New repository secret). The secret NAME is the file name without ".txt" and
          the VALUE is the text inside the file:

            RELEASE_KEYSTORE_BASE64
            RELEASE_KEYSTORE_PASSWORD
            RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD

          Then keep this whole zip somewhere safe (for example Google Drive). If you lose it you
          can never update your app on the Play Store. Don't share it with anyone.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: key/
          retention-days: 1
